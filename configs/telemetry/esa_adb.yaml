# ESA-ADB study (cosmos.ai.telemetry.esa_benchmark).  Frozen protocol: these values are the
# code defaults; tests/test_ai.py::test_configs_match_code fails if code and file diverge.
official_protocol:                    # from the benchmark's own scripts (kplabs-pl/ESA-ADB @67194d3)
  mission1: {grid_s: 30, train_end: "2007-01-01", test_after: "2007-01-01", target_channels: 58}
  mission2: {grid_s: 18, train_end: "2001-10-01", test_after: "2001-10-01", target_channels: 47}
periods_inside_training_half:         # fit | early stopping | calibration + calibrator selection
  mission1: {fit: ["2000-01-01", "2006-01-01"], es: ["2006-01-01", "2006-04-01"], cal: ["2006-04-01", "2007-01-01"]}
  mission2: {fit: ["2000-01-01", "2001-04-01"], es: ["2001-04-01", "2001-05-15"], cal: ["2001-05-15", "2001-10-01"]}
forecast:
  context: 512
  horizon: 16
  d_model: 64
  levels: 7                           # TCN receptive field 509 <= context
  n_layers: 3
  patch: 16
  steps: 20000
  batch: 256
  lr: 0.001
  weight_decay: 0.0001
  eval_every: 1000
  patience: 6
  cov_dropout: 0.3                    # modality dropout on the telecommand stream
nonconformity_delta: 0.05             # floor on the predicted IQR / residual scale (robust units)
calibrators:
  grids:
    threshold: [0.001, 0.0001, 0.00001, 0.0]
    conformal_bh: [0.01, 0.001, 0.0003, 0.0001]
    conformal_bh_rolling: [0.01, 0.001, 0.0003, 0.0001]
  persistence_k: [1, 3, 10, 30]
  merge_hours: 1.0
  rolling: {window_days: 30, lag_days: 1}
  selection: "cross-fitted halves of the calibration period, official corrected event-wise F0.5 (anomalies + rare events); ties -> lower alarm fraction"
encoders: [persistence, ar8, tcn, patchtst, chronos-bolt-small]
seeds: [0, 1, 2]
